; ESPBridge — прозрачный мост UART <-> Ethernet на WT32-ETH01
;
; Плата: WT32-ETH01 (ESP32-WROOM-32 + LAN8720A по RMII)
; Два независимых порта данных: UART1 (CRSF) и UART2 (MAVLink).
; UART0 зарезервирован под прошивку и отладочный лог.
;
; Прошивка по проводу: обычный upload через USB-UART переходник.
; Прошивка по сети: раскомментировать upload_protocol и upload_port.

; Общие настройки платы. Это НЕ окружение сборки, а база для наследования:
; роль модуля здесь не задана, и собрать её саму по себе нельзя.
; Секция без префикса "env:" не попадает в сборку по команде `pio run`.
[wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Скорость заливки по проводу. WT32-ETH01 не всегда держит 921600 —
; при ошибках связи снизить до 115200.
upload_speed = 460800

build_flags =
	-D CORE_DEBUG_LEVEL=3
	; Роль модуля задаётся при сборке, см. env-ы ниже.
	; Тип PHY здесь НЕ объявлять: ETH_PHY_LAN8720 — это элемент перечисления
	; из ETH.h, и макрос с тем же именем ломает его объявление.

lib_deps =
	bblanchon/ArduinoJson@^7.0.4

; --- Тест Ethernet ------------------------------------------------------
; Минимальная прошивка: только подъём LAN8720 и веб-страница.
; Ни UART, ни CRSF, ни OTA. Нужна для проверки железа и распиновки.
; Сборка:  pio run -e test_eth
[env:test_eth]
extends = wt32-eth01
build_src_filter = -<*> +<../test_eth/>
lib_deps =
build_flags =
	-D CORE_DEBUG_LEVEL=3

; --- Наземный модуль (GROUND) -------------------------------------------
; IP 192.168.4.1, шлёт на 192.168.4.2
[env:ground]
extends = wt32-eth01
build_flags =
	${wt32-eth01.build_flags}
	-D BRIDGE_ROLE_GROUND

; --- Бортовой модуль (AIR) ----------------------------------------------
; IP 192.168.4.2, шлёт на 192.168.4.1
[env:air]
extends = wt32-eth01
build_flags =
	${wt32-eth01.build_flags}
	-D BRIDGE_ROLE_AIR

; --- Прошивка по сети (OTA) ---------------------------------------------
; Отдельные окружения, чтобы не переключать комментарии: прошивка по проводу
; и по сети доступны одновременно.
;
;   pio run -e ground-ota -t upload     залить по сети на 192.168.4.1
;   pio run -e air-ota    -t upload     залить по сети на 192.168.4.2
;
; Работает только после того, как плата хотя бы раз прошита по проводу и
; доступна по своему адресу. Пароль задан в прошивке (см. setupOta).
;
; ОСТОРОЖНО с бортовым модулем: обрыв связи посреди записи оставит плату
; неработоспособной до перепрошивки по проводу. Не шить между вылетами.

[env:ground-ota]
extends = env:ground
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=espbridge

[env:air-ota]
extends = env:air
upload_protocol = espota
upload_port = 192.168.4.2
upload_flags =
	--auth=espbridge
