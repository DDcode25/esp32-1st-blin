; ESPBridge — прозрачный мост UART <-> Ethernet на WT32-ETH01
;
; Плата: WT32-ETH01 (ESP32-WROOM-32 + LAN8720A по RMII)
; Фреймворк: ESP-IDF 6.x
;
; Два независимых порта данных: UART1 (CRSF) и UART2 (MAVLink).
; UART0 зарезервирован под прошивку и отладочный лог.

[platformio]
; Исходники в main/ по соглашению ESP-IDF, а не в src/.
; Параметр читается только из этой секции — в окружениях не действует.
src_dir = main

; Общие настройки платы. Это НЕ окружение сборки, а база для наследования:
; роль модуля здесь не задана, и собрать её саму по себе нельзя.
[wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Скорость заливки по проводу. При обрывах связи снизить до 115200.
upload_speed = 460800

; Своя таблица разделов: два раздела приложения для OTA. В таблице по
; умолчанию (singleapp) место под вторую копию прошивки не предусмотрено.
board_build.partitions = partitions.csv

; --- Наземный модуль (GROUND) -------------------------------------------
; IP 192.168.4.1, шлёт на 192.168.4.2
[env:ground]
extends = wt32-eth01
build_flags = -D BRIDGE_ROLE_GROUND

; --- Бортовой модуль (AIR) ----------------------------------------------
; IP 192.168.4.2, шлёт на 192.168.4.1
[env:air]
extends = wt32-eth01
build_flags = -D BRIDGE_ROLE_AIR

; --- Прошивка по сети (OTA) ---------------------------------------------
; Отдельные окружения, чтобы прошивка по проводу и по сети были доступны
; одновременно, без правки комментариев.
;
;   pio run -e ground-ota -t upload
;   pio run -e air-ota    -t upload
;
; Работает после того, как плата хотя бы раз прошита по проводу и доступна
; по своему адресу.
;
; ОСТОРОЖНО с бортовым модулем: хотя обрыв связи не выводит плату из строя
; (запись идёт в неактивный раздел, откат автоматический), шить между
; вылетами наспех не стоит.

[env:ground-ota]
extends = env:ground
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=espbridge

[env:air-ota]
extends = env:air
upload_protocol = espota
upload_port = 192.168.4.2
upload_flags = --auth=espbridge
